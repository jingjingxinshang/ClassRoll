<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
  <title>ClassRoll · 班级学号进度核对卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 html2canvas 与 jsPDF 实现本地高清图片与标准 A4 PDF 导出 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

    :root {
      --bg-canvas: #F3F3F0;
      --surface: #FFFFFF;
      --surface-subtle: #F8F8F6;
      --border-hairline: #E4E4DF;
      --border-strong: #D1D1CA;
      --ink-primary: #18181B;
      --ink-secondary: #52525B;
      --ink-muted: #71717A;
      --accent-vermilion: #DC2626;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#D8D8D2 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--ink-primary);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* 移动端等比缩放外层包装器 */
    .a4-scaler-box {
      position: relative;
      margin: 0 auto;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 标准 A4 纸张物理尺寸 (210mm x 297mm，锁定不可被 Flex 压窄变形) */
    .a4-sheet {
      width: 210mm !important;
      min-width: 210mm !important;
      max-width: 210mm !important;
      min-height: 297mm !important;
      height: 297mm !important;
      flex-shrink: 0 !important;
      padding: 8mm 7.5mm 7mm 7.5mm;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(24, 24, 27, 0.06), 0 12px 32px rgba(24, 24, 27, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      transition: transform 0.15s ease;
    }

    /* 导出截取时强制锁定 1:1 真实尺寸并隐藏辅助按钮 */
    .a4-sheet.exporting-mode {
      position: relative !important;
      transform: none !important;
      box-shadow: none !important;
      border: none !important;
      margin: 0 !important;
    }
    .a4-sheet.exporting-mode .no-export {
      display: none !important;
    }

    /* A4 整页顶部班级标题 */
    .a4-page-header {
      text-align: center;
      font-size: 11.5pt;
      font-weight: 700;
      color: #18181B;
      letter-spacing: 0.06em;
      padding: 1mm 1.5mm 2mm 1.5mm;
      margin-bottom: 3mm;
      border-bottom: 1.5px solid #27272A;
      flex-shrink: 0;
      outline: none;
      line-height: 1.4;
      transition: background-color 0.15s ease;
    }
    .a4-page-header:focus {
      background-color: #F4F4F5;
    }

    /* 1. 卡片平铺网格容器 */
    .cards-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      gap: 5mm;
      width: 100%;
    }

    .check-card {
      border: 1.4px solid #27272A;
      border-radius: 4px;
      padding: 3mm 3.4mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      position: relative;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 裁剪引导虚线 */
    .show-cut-lines .check-card::after {
      content: '';
      position: absolute;
      inset: -2.5mm;
      border: 1px dashed #A1A1AA;
      pointer-events: none;
    }

    /* 可编辑横线 */
    .editable-line {
      border-bottom: 1.3px solid #27272A;
      min-height: 1.35em;
      line-height: 1.3;
      padding: 0 3px;
      outline: none;
      transition: background-color 0.15s ease;
    }
    .editable-line:focus {
      background-color: #F4F4F5;
    }

    /* 学号矩阵网格 */
    .num-grid {
      display: grid !important;
      grid-auto-flow: row;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      align-items: center;
      justify-items: center;
      margin: 1.4mm 0;
      column-gap: 3.5px;
      row-gap: 1.5px;
    }

    .num-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #18181B;
      user-select: none;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .num-cell.multi-digit {
      letter-spacing: -0.35px;
    }

    /* 浅灰虚线圈样式 */
    .num-cell.style-dashed::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border: 1px dashed #D4D4D8;
      border-radius: 9999px;
      pointer-events: none;
    }

    /* 点击模拟红笔画圈标记 */
    .num-cell.circled::before {
      content: '';
      position: absolute;
      width: 23px;
      height: 23px;
      border: 1.8px solid var(--accent-vermilion);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 2;
    }

    /* 2. 列表模式（整页汇总表）样式 */
    .roll-table-wrapper {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .roll-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1.5px solid #18181B;
    }

    .roll-table th,
    .roll-table td {
      border: 1px solid #3F3F46;
      text-align: center;
      vertical-align: middle;
      padding: 0 1px;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 方案 A：标准防压字对角斜线表头单元格 */
    .diagonal-header-cell {
      width: 16mm;
      height: 10mm;
      position: relative;
      background-color: #FAFAFA;
      padding: 0 !important;
      background-image: linear-gradient(
        to top right,
        transparent calc(50% - 0.65px),
        #3F3F46 calc(50% - 0.65px),
        #3F3F46 calc(50% + 0.65px),
        transparent calc(50% + 0.65px)
      );
    }

    .diag-top-right {
      position: absolute;
      top: 1.2mm;
      right: 1.4mm;
      font-size: 7.5pt;
      font-weight: 700;
      color: #18181B;
      line-height: 1;
      user-select: none;
    }

    .diag-bottom-left {
      position: absolute;
      bottom: 1.2mm;
      left: 1.4mm;
      font-size: 7.5pt;
      font-weight: 700;
      color: #18181B;
      line-height: 1;
      user-select: none;
    }

    .date-col-header {
      height: 10mm;
      background-color: #FAFAFA;
      font-size: 8pt;
      font-weight: 600;
      color: #18181B;
      outline: none;
      line-height: 1.15;
      word-break: break-all;
    }
    .date-col-header:focus {
      background-color: #F4F4F5;
    }

    .student-id-cell {
      width: 16mm;
      font-weight: 700;
      font-size: 8.5pt;
      color: #18181B;
      background-color: #FAFAFA;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .mark-grid-cell {
      font-size: 9.5pt;
      font-weight: 700;
      color: #15803D;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.12s ease;
    }
    .mark-grid-cell:hover {
      background-color: #F4F4F5;
    }
    .mark-grid-cell[data-mark="✗"] {
      color: var(--accent-vermilion);
    }

    /* 精致统一控件样式（去 AI 感、克制纸品工作台风格） */
    .ui-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding: 0 9px;
      border-radius: 7px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-hairline);
      font-size: 12px;
      color: var(--ink-secondary);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .ui-pill:hover {
      border-color: var(--border-strong);
    }

    .ui-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 30px;
      padding: 0 10px;
      border-radius: 7px;
      background: var(--surface);
      border: 1px solid var(--border-hairline);
      color: var(--ink-primary);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .ui-btn-secondary:hover {
      background: var(--surface-subtle);
      border-color: var(--border-strong);
    }

    .ui-btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--ink-primary);
      border: 1px solid var(--ink-primary);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .ui-btn-primary:hover {
      background: #27272A;
    }

    @media (hover: none) {
      .card-edit-btn {
        opacity: 0.85 !important;
      }
    }

    .preview-stage {
      padding: 12px 8px 28px;
    }
    @media (min-width: 769px) {
      .preview-stage {
        padding: 18px 20px 36px;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        background-image: none !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .a4-scaler-box {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .a4-sheet {
        transform: none !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        width: 210mm !important;
        height: 297mm !important;
        page-break-after: avoid;
        break-after: avoid;
      }

      .editable-line,
      .date-col-header,
      .mark-grid-cell,
      .a4-page-header {
        background-color: transparent !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 顶部极简纸品工作台工具栏（电脑端全展开；移动端默认收纳） -->
  <header class="no-print bg-white/95 backdrop-blur-md border-b border-[#E4E4DF] sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-2 flex flex-col gap-2">
      
      <!-- 始终可见的主操作栏 -->
      <div class="flex items-center justify-between gap-2">
        <!-- ClassRoll 极简品牌区 -->
        <div class="flex items-center gap-2.5 shrink-0">
          <div class="w-7 h-7 rounded-[7px] bg-[#18181B] text-white flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
          </div>
          <div class="flex items-baseline gap-2">
            <h1 class="text-sm sm:text-[15px] font-bold text-[#18181B] tracking-tight">ClassRoll</h1>
            <span class="hidden sm:inline text-xs text-[#71717A] font-normal">A4 班级学号核对单</span>
          </div>
        </div>

        <!-- 右侧克制统一操作组 -->
        <div class="flex items-center gap-1.5 overflow-x-auto">
          <!-- 移动端专属：展开/收起设置按钮 -->
          <button id="toggleSettingsBtn" type="button" aria-expanded="false" class="md:hidden ui-btn-secondary">
            <span id="toggleSettingsText">设置 ▾</span>
          </button>

          <button id="exportImgBtn" type="button" class="ui-btn-secondary" title="导出高清 PNG 图片">
            <svg class="w-3.5 h-3.5 text-[#52525B]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span>存图</span>
          </button>

          <button id="exportPdfBtn" type="button" class="ui-btn-secondary" title="导出标准 A4 PDF 文档">
            <svg class="w-3.5 h-3.5 text-[#52525B]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <span>导出 PDF</span>
          </button>

          <button id="printBtn" type="button" class="ui-btn-primary">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
            </svg>
            <span>打印 A4</span>
          </button>
        </div>
      </div>

      <!-- 可折叠详细修改项容器：移动端默认 hidden，电脑端 (md:flex) 始终全部展示 -->
      <div id="collapsibleControls" class="hidden md:flex flex-col gap-2 pt-2 border-t border-[#ECECE8]">
        
        <!-- 第一排：版式结构与批量工具 -->
        <div class="flex flex-wrap items-center gap-1.5">
          <!-- 视图模式切换 -->
          <div class="ui-pill">
            <label for="viewModeSelect" class="text-[#71717A] whitespace-nowrap">模式</label>
            <select id="viewModeSelect" class="bg-transparent font-semibold text-[#18181B] focus:outline-none cursor-pointer">
              <option value="cards" selected>卡片平铺</option>
              <option value="table">列表汇总表</option>
            </select>
          </div>

          <!-- 卡片模式专属选项组 -->
          <div id="cardModeControls" class="flex flex-wrap items-center gap-1.5">
            <div class="ui-pill">
              <label for="layoutSelect" class="text-[#71717A] whitespace-nowrap">平铺</label>
              <select id="layoutSelect" class="bg-transparent font-semibold text-[#18181B] focus:outline-none cursor-pointer">
                <option value="2x2">4格/页 (2×2)</option>
                <option value="2x3">6格/页 (2×3)</option>
                <option value="2x4" selected>8格/页 (2×4)</option>
              </select>
            </div>

            <div class="ui-pill">
              <label for="colsPerRowSelect" class="text-[#71717A] whitespace-nowrap">每行</label>
              <select id="colsPerRowSelect" class="bg-transparent font-semibold text-[#18181B] focus:outline-none cursor-pointer">
                <option value="5">5 个</option>
                <option value="8">8 个</option>
                <option value="10" selected>10 个</option>
                <option value="12">12 个</option>
              </select>
            </div>

            <div class="ui-pill">
              <label for="numStyleSelect" class="text-[#71717A] whitespace-nowrap">样式</label>
              <select id="numStyleSelect" class="bg-transparent font-semibold text-[#18181B] focus:outline-none cursor-pointer">
                <option value="plain" selected>纯数字 (1)</option>
                <option value="dot">带点号 (1.)</option>
                <option value="dashed">虚线圈 (①)</option>
              </select>
            </div>

            <label class="ui-pill cursor-pointer select-none">
              <input type="checkbox" id="cutLineToggle" checked class="accent-[#18181B] rounded">
              <span class="text-[#3F3F46] font-medium">裁剪虚线</span>
            </label>

            <label class="ui-pill cursor-pointer select-none">
              <input type="checkbox" id="remarkToggle" checked class="accent-[#18181B] rounded">
              <span class="text-[#3F3F46] font-medium">备注栏</span>
            </label>
          </div>

          <!-- 列表模式（汇总表）专属选项组 -->
          <div id="tableModeControls" class="hidden flex flex-wrap items-center gap-1.5">
            <div class="ui-pill">
              <label for="dateColsInput" class="text-[#71717A] whitespace-nowrap">日期列数</label>
              <input type="number" id="dateColsInput" value="15" min="3" max="35" class="w-11 text-center bg-white rounded border border-[#D4D4D8] font-semibold text-[#18181B] focus:outline-none focus:border-[#18181B]">
            </div>
          </div>

          <button id="toggleBatchBtn" type="button" class="ui-btn-secondary">
            批量填字
          </button>

          <button id="clearMarksBtn" type="button" class="ui-btn-secondary text-[#71717A] hover:text-[#18181B]">
            重置
          </button>
        </div>

        <!-- 第二排：班级标题与学号范围设置 -->
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <!-- 页面标题与位置 -->
          <div class="flex flex-wrap items-center gap-1.5">
            <div class="ui-pill bg-white">
              <label for="pageTitleInput" class="text-[#71717A] whitespace-nowrap">标题</label>
              <input type="text" id="pageTitleInput" value="一年级 4 班" placeholder="留空则隐藏" class="w-24 sm:w-28 bg-transparent text-[#18181B] font-semibold focus:outline-none">
            </div>
            <div class="inline-flex h-[30px] rounded-[7px] bg-[#F3F3F0] p-0.5 border border-[#E4E4DF]" title="标题对齐位置">
              <button type="button" data-align="left" class="title-align-btn px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer">左上</button>
              <button type="button" data-align="center" class="title-align-btn px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer">居中</button>
              <button type="button" data-align="right" class="title-align-btn px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer">右上</button>
            </div>
          </div>

          <div class="hidden sm:block h-4 w-[1px] bg-[#E4E4DF]"></div>

          <!-- 学号范围 / 自由跳号 -->
          <div class="flex flex-wrap items-center gap-1.5">
            <div class="inline-flex h-[30px] rounded-[7px] bg-[#F3F3F0] p-0.5 border border-[#E4E4DF]">
              <button type="button" id="modeRangeBtn" class="px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer">连续学号</button>
              <button type="button" id="modeCustomBtn" class="px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer">自定义跳号</button>
            </div>

            <!-- 模式 1：连续范围 -->
            <div id="rangeControls" class="flex items-center gap-1.5">
              <div class="ui-pill bg-white">
                <input type="number" id="startNumInput" value="1" aria-label="起始学号" class="w-10 text-center bg-transparent font-semibold text-[#18181B] focus:outline-none">
                <span class="text-[#A1A1AA]">~</span>
                <input type="number" id="endNumInput" value="44" aria-label="结束学号" class="w-10 text-center bg-transparent font-semibold text-[#18181B] focus:outline-none">
              </div>
              <button id="applyRangeBtn" type="button" class="ui-btn-secondary font-semibold">
                应用
              </button>
            </div>

            <!-- 模式 2：自由/跳号 -->
            <div id="customControls" class="hidden flex items-center gap-1.5">
              <input type="text" id="customListInput" placeholder="如：1~15, 17~44" class="h-[30px] w-44 sm:w-56 px-2.5 rounded-[7px] border border-[#E4E4DF] bg-white text-xs text-[#18181B] focus:outline-none focus:border-[#18181B]">
              <button id="applyCustomBtn" type="button" class="ui-btn-secondary font-semibold">
                生成
              </button>
            </div>
          </div>
        </div>

        <!-- 展开式批量填写栏 -->
        <div id="batchPanel" class="hidden bg-[#F8F8F6] rounded-[8px] border border-[#E4E4DF]">

  <!-- 底部轻量提示条 -->
  <div id="toastBanner" class="no-print hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-[#18181B] text-white text-xs sm:text-sm px-4 py-2 rounded-lg shadow-lg transition"></div>

  <script>
    // 全局应用状态初始化
    const state = {
      viewMode: 'cards',
      layout: '2x4',
      colsPerRow: 10,
      numStyle: 'plain',
      showCutLines: true,
      showRemark: true,
      dateCols: 15,
      pageTitle: '一年级 4 班',
      titleAlign: 'center',
      numMode: 'range',
      startNum: 1,
      endNum: 44,
      customRaw: '',
      batchDate: '',
      batchTask: '',
      batchRemark: '',
      cardLists: [],
      cardTexts: [],
      tableHeaders: [],
      tableMarks: {},
      editingCardIndex: null,
      mobileSettingsOpen: false,
      lastExportUrl: null
    };

    // 核心 DOM 元素引用
    const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
    const toggleSettingsText = document.getElementById('toggleSettingsText');
    const collapsibleControls = document.getElementById('collapsibleControls');
    const collapseSettingsBottomBtn = document.getElementById('collapseSettingsBottomBtn');

    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const exportImgBtn = document.getElementById('exportImgBtn');
    const printBtn = document.getElementById('printBtn');

    const viewModeSelect = document.getElementById('viewModeSelect');
    const cardModeControls = document.getElementById('cardModeControls');
    const tableModeControls = document.getElementById('tableModeControls');
    const layoutSelect = document.getElementById('layoutSelect');
    const colsPerRowSelect = document.getElementById('colsPerRowSelect');
    const numStyleSelect = document.getElementById('numStyleSelect');
    const cutLineToggle = document.getElementById('cutLineToggle');
    const remarkToggle = document.getElementById('remarkToggle');
    const dateColsInput = document.getElementById('dateColsInput');

    const pageTitleInput = document.getElementById('pageTitleInput');
    const titleAlignBtns = document.querySelectorAll('.title-align-btn');

    const modeRangeBtn = document.getElementById('modeRangeBtn');
    const modeCustomBtn = document.getElementById('modeCustomBtn');
    const rangeControls = document.getElementById('rangeControls');
    const customControls = document.getElementById('customControls');
    const startNumInput = document.getElementById('startNumInput');
    const endNumInput = document.getElementById('endNumInput');
    const applyRangeBtn = document.getElementById('applyRangeBtn');
    const customListInput = document.getElementById('customListInput');
    const applyCustomBtn = document.getElementById('applyCustomBtn');

    const toggleBatchBtn = document.getElementById('toggleBatchBtn');
    const clearMarksBtn = document.getElementById('clearMarksBtn');
    const batchPanel = document.getElementById('batchPanel');
    const batchCardFields = document.getElementById('batchCardFields');
    const batchTableFields = document.getElementById('batchTableFields');
    const batchDateInput = document.getElementById('batchDateInput');
    const batchTaskInput = document.getElementById('batchTaskInput');
    const batchRemarkInput = document.getElementById('batchRemarkInput');
    const applyBatchCardBtn = document.getElementById('applyBatchCardBtn');
    const batchTableDatesInput = document.getElementById('batchTableDatesInput');
    const applyBatchTableBtn = document.getElementById('applyBatchTableBtn');

    const a4ScalerBox = document.getElementById('a4ScalerBox');
    const a4Sheet = document.getElementById('a4Sheet');
    const a4PageHeader = document.getElementById('a4PageHeader');
    const cardsGrid = document.getElementById('cardsGrid');
    const rollTableWrapper = document.getElementById('rollTableWrapper');

    const exportModal = document.getElementById('exportModal');
    const exportModalTitle = document.getElementById('exportModalTitle');
    const exportModalHint = document.getElementById('exportModalHint');
    const exportLoadingSpinner = document.getElementById('exportLoadingSpinner');
    const exportPreviewImg = document.getElementById('exportPreviewImg');
    const directDownloadLink = document.getElementById('directDownloadLink');
    const closeExportModalBtn = document.getElementById('closeExportModalBtn');
    const closeExportModalFooterBtn = document.getElementById('closeExportModalFooterBtn');

    const singleCardModal = document.getElementById('singleCardModal');
    const modalCardTitle = document.getElementById('modalCardTitle');
    const modalRangeInput = document.getElementById('modalRangeInput');
    const modalGenRangeBtn = document.getElementById('modalGenRangeBtn');
    const modalListTextarea = document.getElementById('modalListTextarea');
    const saveModalBtn = document.getElementById('saveModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');

    const toastBanner = document.getElementById('toastBanner');
    let toastTimer = null;

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBanner.classList.add('hidden');
      }, 2400);
    }

    function setMobileSettingsOpen(open) {
      state.mobileSettingsOpen = open;
      toggleSettingsBtn.setAttribute('aria-expanded', String(open));
      if (open) {
        collapsibleControls.classList.remove('hidden');
        collapsibleControls.classList.add('flex');
        toggleSettingsText.textContent = '收起 ▴';
      } else {
        collapsibleControls.classList.add('hidden');
        collapsibleControls.classList.remove('flex');
        toggleSettingsText.textContent = '设置 ▾';
      }
      requestAnimationFrame(updateMobileScale);
    }

    function updateMobileScale() {
      if (a4Sheet.classList.contains('exporting-mode')) return;
      const horizontalPadding = window.innerWidth <= 768 ? 16 : 40;
      const availableWidth = Math.max(260, document.documentElement.clientWidth - horizontalPadding);
      const sheetRectWidth = a4Sheet.offsetWidth || 794;
      const sheetRectHeight = a4Sheet.offsetHeight || 1123;

      if (availableWidth < sheetRectWidth) {
        const scale = availableWidth / sheetRectWidth;
        const scaledW = Math.floor(sheetRectWidth * scale);
        const scaledH = Math.ceil(sheetRectHeight * scale);
        a4ScalerBox.style.width = `${scaledW}px`;
        a4ScalerBox.style.height = `${scaledH}px`;
        a4Sheet.style.transform = `scale(${scale})`;
      } else {
        a4ScalerBox.style.width = `${sheetRectWidth}px`;
        a4ScalerBox.style.height = `${sheetRectHeight}px`;
        a4Sheet.style.transform = 'none';
      }
    }

    function generateRangeList(start, end) {
      const s = Number.isFinite(start) ? Math.floor(start) : 1;
      const e = Number.isFinite(end) ? Math.floor(end) : 44;
      const result = [];
      if (s <= e) {
        for (let i = s; i <= e && result.length < 400; i++) {
          result.push(String(i));
        }
      } else {
        for (let i = s; i >= e && result.length < 400; i--) {
          result.push(String(i));
        }
      }
      return result.length > 0 ? result : ['1'];
    }

    function parseCustomTokens(rawText) {
      if (!rawText || !rawText.trim()) return [];
      const tokens = rawText
        .split(/[\s,，、;；\n\r]+/)
        .map((t) => t.trim())
        .filter(Boolean);

      const result = [];
      for (const token of tokens) {
        const rangeMatch = token.match(/^(-?\d+)\s*(?:~|-|至|\.\.)\s*(-?\d+)$/);
        if (rangeMatch) {
          const s = parseInt(rangeMatch[1], 10);
          const e = parseInt(rangeMatch[2], 10);
          const expanded = generateRangeList(s, e);
          for (const item of expanded) {
            if (result.length < 400) result.push(item);
          }
        } else if (result.length < 400) {
          result.push(token);
        }
      }
      return result;
    }

    function getGlobalBaseList() {
      if (state.numMode === 'custom') {
        const parsed = parseCustomTokens(state.customRaw);
        if (parsed.length > 0) return parsed;
      }
      return generateRangeList(state.startNum, state.endNum);
    }

    function syncAllCardLists(overwriteExisting = true) {
      const [cols, rows] = state.layout.split('x').map(Number);
      const totalCards = cols * rows;
      const baseList = getGlobalBaseList();

      for (let i = 0; i < totalCards; i++) {
        if (overwriteExisting || !Array.isArray(state.cardLists[i])) {
          state.cardLists[i] = [...baseList];
        }
        if (overwriteExisting || !state.cardTexts[i]) {
          state.cardTexts[i] = {
            date: state.batchDate || '',
            task: state.batchTask || '',
            remark: state.batchRemark || ''
          };
        }
      }
      state.cardLists.length = totalCards;
      state.cardTexts.length = totalCards;
    }

    function renderSheet() {
      if (state.pageTitle && state.pageTitle.trim() !== '') {
        a4PageHeader.classList.remove('hidden');
        a4PageHeader.style.textAlign = state.titleAlign;
        if (a4PageHeader.textContent !== state.pageTitle) {
          a4PageHeader.textContent = state.pageTitle;
        }
      } else {
        a4PageHeader.classList.add('hidden');
      }

      if (state.viewMode === 'cards') {
        cardsGrid.classList.remove('hidden');
        rollTableWrapper.classList.add('hidden');
        renderCardsGrid();
      } else {
        cardsGrid.classList.add('hidden');
        rollTableWrapper.classList.remove('hidden');
        renderRollTable();
      }

      requestAnimationFrame(updateMobileScale);
    }

    function renderCardsGrid() {
      const [cols, rows] = state.layout.split('x').map(Number);
      const totalCards = cols * rows;

      cardsGrid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      cardsGrid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

      let headerFontSize = '9pt';
      let numFontSize = '9pt';
      if (state.layout === '2x2') {
        headerFontSize = '11pt';
        numFontSize = '12pt';
      } else if (state.layout === '2x3') {
        headerFontSize = '10pt';
        numFontSize = '10.5pt';
      }

      cardsGrid.innerHTML = '';

      for (let cardIdx = 0; cardIdx < totalCards; cardIdx++) {
        const list = state.cardLists[cardIdx] || getGlobalBaseList();
        const textData = state.cardTexts[cardIdx] || { date: '', task: '', remark: '' };
        const gridCols = state.colsPerRow;
        const gridRows = Math.max(1, Math.ceil(list.length / gridCols));

        let cardNumFontSize = numFontSize;
        if (list.length > 70 || gridCols >= 12) {
          cardNumFontSize = state.layout === '2x4' ? '7.5pt' : '8.5pt';
        }

        const card = document.createElement('div');
        card.className = 'check-card group';

        const topRow = document.createElement('div');
        topRow.className = 'flex items-end gap-2 w-full shrink-0';
        topRow.style.fontSize = headerFontSize;

        const dateGroup = document.createElement('div');
        dateGroup.className = 'flex items-end shrink-0';
        dateGroup.style.width = '37%';
        const dateLabel = document.createElement('span');
        dateLabel.className = 'font-bold text-[#18181B] whitespace-nowrap select-none';
        dateLabel.textContent = '日期：';
        const dateField = document.createElement('div');
        dateField.className = 'editable-line flex-1 text-[#18181B] font-medium truncate';
        dateField.contentEditable = 'true';
        dateField.spellcheck = false;
        dateField.textContent = textData.date;
        dateField.addEventListener('input', () => {
          state.cardTexts[cardIdx].date = dateField.textContent;
        });
        dateGroup.appendChild(dateLabel);
        dateGroup.appendChild(dateField);

        const taskGroup = document.createElement('div');
        taskGroup.className = 'flex items-end flex-1 min-w-0';
        const taskLabel = document.createElement('span');
        taskLabel.className = 'font-bold text-[#18181B] whitespace-nowrap select-none';
        taskLabel.textContent = '内容：';
        const taskField = document.createElement('div');
        taskField.className = 'editable-line flex-1 text-[#18181B] font-medium truncate';
        taskField.contentEditable = 'true';
        taskField.spellcheck = false;
        taskField.textContent = textData.task;
        taskField.addEventListener('input', () => {
          state.cardTexts[cardIdx].task = taskField.textContent;
        });
        taskGroup.appendChild(taskLabel);
        taskGroup.appendChild(taskField);

        topRow.appendChild(dateGroup);
        topRow.appendChild(taskGroup);
        card.appendChild(topRow);

        const numGrid = document.createElement('div');
        numGrid.className = 'num-grid';
        numGrid.style.gridTemplateColumns = `repeat(${gridCols}, minmax(0, 1fr))`;
        numGrid.style.gridTemplateRows = `repeat(${gridRows}, minmax(0, 1fr))`;
        numGrid.style.fontSize = cardNumFontSize;
        numGrid.style.columnGap = gridCols >= 10 ? '3px' : '5px';

        list.forEach((rawItem) => {
          const cell = document.createElement('div');
          cell.className = 'num-cell';
          if (String(rawItem).length >= 2) {
            cell.classList.add('multi-digit');
          }
          if (state.numStyle === 'dashed') {
            cell.classList.add('style-dashed');
          }
          cell.textContent = state.numStyle === 'dot' ? `${rawItem}.` : rawItem;
          cell.title = '点击画红圈 / 取消';
          cell.addEventListener('click', () => {
            cell.classList.toggle('circled');
          });
          numGrid.appendChild(cell);
        });

        card.appendChild(numGrid);

        const bottomRow = document.createElement('div');
        bottomRow.className = 'flex items-end justify-between gap-1.5 w-full shrink-0';
        bottomRow.style.fontSize = headerFontSize;

        if (state.showRemark) {
          const remarkGroup = document.createElement('div');
          remarkGroup.className = 'flex items-end flex-1 min-w-0';

          const remarkLabel = document.createElement('span');
          remarkLabel.className = 'font-bold text-[#27272A] whitespace-nowrap select-none';
          remarkLabel.textContent = '备注：';

          const remarkField = document.createElement('div');
          remarkField.className = 'editable-line flex-1 text-[#18181B] truncate';
          remarkField.contentEditable = 'true';
          remarkField.spellcheck = false;
          remarkField.textContent = textData.remark;
          remarkField.addEventListener('input', () => {
            state.cardTexts[cardIdx].remark = remarkField.textContent;
          });

          remarkGroup.appendChild(remarkLabel);
          remarkGroup.appendChild(remarkField);
          bottomRow.appendChild(remarkGroup);
        } else {
          const spacer = document.createElement('div');
          spacer.className = 'flex-1';
          bottomRow.appendChild(spacer);
        }

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.title = `自定义第 ${cardIdx + 1} 张卡片学号`;
        editBtn.className = 'no-print no-export card-edit-btn opacity-0 group-hover:opacity-90 focus:opacity-100 shrink-0 w-5 h-5 rounded bg-[#F3F3F0] hover:bg-[#18181B] text-[#52525B] hover:text-white border border-[#D4D4D8] hover:border-[#18181B] flex items-center justify-center text-[11px] leading-none transition cursor-pointer';
        editBtn.innerHTML = '✎';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openSingleCardModal(cardIdx);
        });
        bottomRow.appendChild(editBtn);

        card.appendChild(bottomRow);
        cardsGrid.appendChild(card);
      }
    }

    function renderRollTable() {
      const studentList = getGlobalBaseList();
      const colCount = Math.max(3, Math.min(35, state.dateCols || 15));

      rollTableWrapper.innerHTML = '';
      const table = document.createElement('table');
      table.className = 'roll-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      const cornerTh = document.createElement('th');
      cornerTh.className = 'diagonal-header-cell';
      cornerTh.innerHTML = `
        <span class="diag-top-right">日期</span>
        <span class="diag-bottom-left">学号</span>
      `;
      headerRow.appendChild(cornerTh);

      for (let c = 0; c < colCount; c++) {
        const th = document.createElement('th');
        th.className = 'date-col-header';
        th.contentEditable = 'true';
        th.spellcheck = false;
        th.textContent = state.tableHeaders[c] || '';
        th.title = '点击填写日期';
        th.addEventListener('input', () => {
          state.tableHeaders[c] = th.textContent;
        });
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      studentList.forEach((stuNo, rIdx) => {
        const tr = document.createElement('tr');

        const idTd = document.createElement('td');
        idTd.className = 'student-id-cell';
        idTd.textContent = state.numStyle === 'dot' ? `${stuNo}.` : stuNo;
        tr.appendChild(idTd);

        for (let c = 0; c < colCount; c++) {
          const td = document.createElement('td');
          td.className = 'mark-grid-cell';
          const key = `${rIdx}_${c}`;
          const savedVal = state.tableMarks[key] || '';
          td.textContent = savedVal;
          if (savedVal) td.dataset.mark = savedVal;
          td.title = '轻点切换 空 → ✓ → ✗';

          td.addEventListener('click', () => {
            const cur = state.tableMarks[key] || '';
            let next = '';
            if (cur === '') next = '✓';
            else if (cur === '✓') next = '✗';
            else next = '';

            state.tableMarks[key] = next;
            td.textContent = next;
            if (next) td.dataset.mark = next;
            else delete td.dataset.mark;
          });

          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      rollTableWrapper.appendChild(table);
    }

    async function captureA4Canvas() {
      if (typeof window.html2canvas !== 'function') {
        throw new Error('图像渲染组件尚未加载完成，请稍后重试或使用“打印 A4”');
      }

      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }

      const prevTransform = a4Sheet.style.transform;
      a4Sheet.classList.add('exporting-mode');
      a4Sheet.style.transform = 'none';

      try {
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        const canvas = await window.html2canvas(a4Sheet, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false,
          width: a4Sheet.offsetWidth,
          height: a4Sheet.offsetHeight
        });
        return canvas;
      } finally {
        a4Sheet.classList.remove('exporting-mode');
        a4Sheet.style.transform = prevTransform;
        updateMobileScale();
      }
    }

    function openExportModalWithResult({ title, hint, previewDataUrl, downloadUrl, fileName }) {
      if (state.lastExportUrl && state.lastExportUrl.startsWith('blob:')) {
        URL.revokeObjectURL(state.lastExportUrl);
      }
      state.lastExportUrl = downloadUrl;

      exportModalTitle.textContent = title;
      exportModalHint.textContent = hint;
      exportLoadingSpinner.classList.add('hidden');
      exportPreviewImg.src = previewDataUrl;
      exportPreviewImg.classList.remove('hidden');

      directDownloadLink.href = downloadUrl;
      directDownloadLink.download = fileName;

      try {
        const tempLink = document.createElement('a');
        tempLink.href = downloadUrl;
        tempLink.download = fileName;
        tempLink.style.display = 'none';
        document.body.appendChild(tempLink);
        tempLink.click();
        document.body.removeChild(tempLink);
      } catch (err) {
        // 沙盒限制自动下载时回退到弹窗按钮与长按保存
      }
    }

    async function handleExportImage(customNotice) {
      exportModalTitle.textContent = '正在生成高清 A4 图片...';
      exportModalHint.textContent = '高分辨率渲染中，请稍候';
      exportLoadingSpinner.classList.remove('hidden');
      exportPreviewImg.classList.add('hidden');
      exportModal.classList.remove('hidden');

      try {
        const canvas = await captureA4Canvas();
        const dataUrl = canvas.toDataURL('image/png');
        const safeTitle = (state.pageTitle || '一年级 4 班').trim().replace(/[\\/:*?"<>|]/g, '_') || '一年级 4 班';
        const fileName = `ClassRoll-${safeTitle}.png`;

        openExportModalWithResult({
          title: customNotice ? '已为您生成高清 A4 打印图' : '高清 A4 图片已生成',
          hint: customNotice || '长按图片可保存或转发微信打印，也可点击下方“立即下载文件”',
          previewDataUrl: dataUrl,
          downloadUrl: dataUrl,
          fileName
        });
      } catch (error) {
        exportModal.classList.add('hidden');
        showToast(error.message || '导出图片失败，请尝试“打印 A4”');
      }
    }

    async function handleExportPdf() {
      exportModalTitle.textContent = '正在生成标准 A4 PDF...';
      exportModalHint.textContent = '正在排版 210mm × 297mm 打印文档，请稍候';
      exportLoadingSpinner.classList.remove('hidden');
      exportPreviewImg.classList.add('hidden');
      exportModal.classList.remove('hidden');

      try {
        const canvas = await captureA4Canvas();
        const previewImgData = canvas.toDataURL('image/jpeg', 0.96);
        const safeTitle = (state.pageTitle || '一年级 4 班').trim().replace(/[\\/:*?"<>|]/g, '_') || '一年级 4 班';
        const fileName = `ClassRoll-${safeTitle}.pdf`;

        const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (typeof jsPDFCtor !== 'function') {
          throw new Error('PDF 组件未加载完成，请稍后重试或点击“存图”');
        }

        const pdf = new jsPDFCtor({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4'
        });

        pdf.addImage(previewImgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
        const pdfBlob = pdf.output('blob');
        const pdfBlobUrl = URL.createObjectURL(pdfBlob);

        openExportModalWithResult({
          title: '标准 A4 PDF 已生成',
          hint: '已尝试自动下载 PDF；长按图片可保存或转发微信打印',
          previewDataUrl: previewImgData,
          downloadUrl: pdfBlobUrl,
          fileName
        });
      } catch (error) {
        exportModal.classList.add('hidden');
        showToast(error.message || '导出 PDF 失败，请重试');
      }
    }

    function switchNumMode(newMode) {
      state.numMode = newMode;
      if (newMode === 'range') {
        modeRangeBtn.className = 'px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer';
        modeCustomBtn.className = 'px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer';
        rangeControls.classList.remove('hidden');
        customControls.classList.add('hidden');
      } else {
        modeCustomBtn.className = 'px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer';
        modeRangeBtn.className = 'px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer';
        customControls.classList.remove('hidden');
        rangeControls.classList.add('hidden');
      }
    }

    function openSingleCardModal(cardIdx) {
      state.editingCardIndex = cardIdx;
      modalCardTitle.textContent = `自定义第 ${cardIdx + 1} 张卡片学号`;
      modalRangeInput.value = '';
      const currentList = state.cardLists[cardIdx] || getGlobalBaseList();
      modalListTextarea.value = currentList.join(' ');
      singleCardModal.classList.remove('hidden');
    }

    function closeSingleCardModal() {
      singleCardModal.classList.add('hidden');
      state.editingCardIndex = null;
    }

    toggleSettingsBtn.addEventListener('click', () => {
      setMobileSettingsOpen(!state.mobileSettingsOpen);
    });
    collapseSettingsBottomBtn.addEventListener('click', () => {
      setMobileSettingsOpen(false);
    });

    viewModeSelect.addEventListener('change', (e) => {
      state.viewMode = e.target.value;
      if (state.viewMode === 'cards') {
        cardModeControls.classList.remove('hidden');
        tableModeControls.classList.add('hidden');
        batchCardFields.classList.remove('hidden');
        batchTableFields.classList.add('hidden');
      } else {
        cardModeControls.classList.add('hidden');
        tableModeControls.classList.remove('hidden');
        batchCardFields.classList.add('hidden');
        batchTableFields.classList.remove('hidden');
      }
      renderSheet();
    });

    layoutSelect.addEventListener('change', (e) => {
      state.layout = e.target.value;
      syncAllCardLists(false);
      renderSheet();
    });

    colsPerRowSelect.addEventListener('change', (e) => {
      state.colsPerRow = parseInt(e.target.value, 10) || 10;
      renderSheet();
    });

    numStyleSelect.addEventListener('change', (e) => {
      state.numStyle = e.target.value;
      renderSheet();
    });

    cutLineToggle.addEventListener('change', (e) => {
      state.showCutLines = e.target.checked;
      a4Sheet.classList.toggle('show-cut-lines', state.showCutLines);
    });

    remarkToggle.addEventListener('change', (e) => {
      state.showRemark = e.target.checked;
      renderSheet();
    });

    dateColsInput.addEventListener('change', (e) => {
      const val = parseInt(e.target.value, 10);
      state.dateCols = Number.isFinite(val) ? Math.max(3, Math.min(35, val)) : 15;
      dateColsInput.value = state.dateCols;
      renderSheet();
    });

    pageTitleInput.addEventListener('input', (e) => {
      state.pageTitle = e.target.value;
      renderSheet();
    });

    titleAlignBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        state.titleAlign = btn.dataset.align;
        titleAlignBtns.forEach((b) => {
          const isActive = b.dataset.align === state.titleAlign;
          b.className = isActive
            ? 'title-align-btn px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer'
            : 'title-align-btn px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer';
        });
        renderSheet();
      });
    });

    a4PageHeader.addEventListener('input', () => {
      state.pageTitle = a4PageHeader.textContent;
      pageTitleInput.value = state.pageTitle;
    });

    modeRangeBtn.addEventListener('click', () => switchNumMode('range'));
    modeCustomBtn.addEventListener('click', () => switchNumMode('custom'));

    applyRangeBtn.addEventListener('click', () => {
      const s = parseInt(startNumInput.value, 10);
      const e = parseInt(endNumInput.value, 10);
      state.startNum = Number.isFinite(s) ? s : 1;
      state.endNum = Number.isFinite(e) ? e : 44;
      syncAllCardLists(true);
      renderSheet();
      showToast(`已更新学号：${state.startNum} ~ ${state.endNum}`);
    });

    applyCustomBtn.addEventListener('click', () => {
      state.customRaw = customListInput.value;
      syncAllCardLists(true);
      renderSheet();
      showToast('已应用自定义学号列表');
    });

    toggleBatchBtn.addEventListener('click', () => {
      batchPanel.classList.toggle('hidden');
      requestAnimationFrame(updateMobileScale);
    });

    applyBatchCardBtn.addEventListener('click', () => {
      state.batchDate = batchDateInput.value;
      state.batchTask = batchTaskInput.value;
      state.batchRemark = batchRemarkInput.value;
      state.cardTexts = state.cardTexts.map(() => ({
        date: state.batchDate,
        task: state.batchTask,
        remark: state.batchRemark
      }));
      renderSheet();
      showToast('已批量填入全部卡片');
    });

    applyBatchTableBtn.addEventListener('click', () => {
      const tokens = batchTableDatesInput.value
        .split(/[\s,，、;；]+/)
        .map((t) => t.trim())
        .filter(Boolean);
      for (let i = 0; i < state.dateCols; i++) {
        if (tokens[i] !== undefined) {
          state.tableHeaders[i] = tokens[i];
        }
      }
      renderSheet();
      showToast('已填入表头日期');
    });

    clearMarksBtn.addEventListener('click', () => {
      state.batchDate = '';
      state.batchTask = '';
      state.batchRemark = '';
      state.tableHeaders = [];
      state.tableMarks = {};
      state.pageTitle = '一年级 4 班';
      state.titleAlign = 'center';
      pageTitleInput.value = '一年级 4 班';
      titleAlignBtns.forEach((b) => {
        const isActive = b.dataset.align === 'center';
        b.className = isActive
          ? 'title-align-btn px-2 rounded-[5px] text-xs font-semibold bg-white text-[#18181B] shadow-[0_1px_2px_rgba(0,0,0,0.06)] transition cursor-pointer'
          : 'title-align-btn px-2 rounded-[5px] text-xs font-medium text-[#71717A] hover:text-[#18181B] transition cursor-pointer';
      });
      batchDateInput.value = '';
      batchTaskInput.value = '';
      batchRemarkInput.value = '';
      batchTableDatesInput.value = '';
      syncAllCardLists(true);
      renderSheet();
      showToast('已清空并恢复默认设置');
    });

    exportPdfBtn.addEventListener('click', handleExportPdf);
    exportImgBtn.addEventListener('click', () => handleExportImage());
    printBtn.addEventListener('click', () => {
      const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
      if (isWeChat) {
        handleExportImage('微信内置浏览器不支持直接调用系统打印，已为您生成高清 A4 图片，长按保存或转发给微信文件传输助手即可打印！');
        return;
      }
      a4Sheet.style.transform = 'none';
      window.print();
      setTimeout(updateMobileScale, 300);
    });

    function closeExportModal() {
      exportModal.classList.add('hidden');
    }
    closeExportModalBtn.addEventListener('click', closeExportModal);
    closeExportModalFooterBtn.addEventListener('click', closeExportModal);
    exportModal.addEventListener('click', (e) => {
      if (e.target === exportModal) closeExportModal();
    });

    modalGenRangeBtn.addEventListener('click', () => {
      const parsed = parseCustomTokens(modalRangeInput.value);
      if (parsed.length > 0) {
        modalListTextarea.value = parsed.join(' ');
      }
    });

    saveModalBtn.addEventListener('click', () => {
      if (state.editingCardIndex !== null) {
        const parsed = parseCustomTokens(modalListTextarea.value);
        if (parsed.length > 0) {
          state.cardLists[state.editingCardIndex] = parsed;
          renderSheet();
          showToast(`已更新第 ${state.editingCardIndex + 1} 张卡片学号`);
        }
      }
      closeSingleCardModal();
    });

    closeModalBtn.addEventListener('click', closeSingleCardModal);
    cancelModalBtn.addEventListener('click', closeSingleCardModal);
    singleCardModal.addEventListener('click', (e) => {
      if (e.target === singleCardModal) closeSingleCardModal();
    });

    window.addEventListener('resize', updateMobileScale);

    window.addEventListener('DOMContentLoaded', () => {
      syncAllCardLists(true);
      renderSheet();
    });
  </script>
</body>
</html>
